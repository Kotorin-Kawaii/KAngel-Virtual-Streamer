[project]
name = "kangel-virtual-streamer"
version = "0.1.0"
description = "AI virtual streamer backend with persistent persona, viewer memory, danmaku WebSocket and OpenAI-compatible model support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "pydantic==2.5.0",
    "pydantic-settings>=2.2.1",
    "uvicorn[standard]==0.24.0",
    "websockets>=13.0",
    "lancedb>=0.5.0",
    "numpy>=1.24.0",
    "fastembed>=0.2.0",
    "scikit-learn>=1.3.0",
]
