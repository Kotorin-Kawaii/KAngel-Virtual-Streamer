[project]
name = "kangel-server"
version = "0.1.0"
description = "虚拟主播直播系统 - 支持RAG增强的弹幕回复生成"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.104.1",
    "pydantic==2.5.0",
    "pydantic-settings>=2.2.1",
    "uvicorn[standard]==0.24.0",
    "websockets>=13.0",
    "lancedb>=0.5.0",
    "numpy>=1.24.0",
    "fastembed>=0.2.0",
    "onnxruntime==1.19.2",
    "scikit-learn>=1.3.0",
    "psutil>=5.9.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
kangel-server = "kangel.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kangel*"]
